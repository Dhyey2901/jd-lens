[project]
name = "jd-lens"
version = "1.0.0"
description = "NLP-powered Job Description Analyser & Role-Fit Scorer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "extractor", "classifier", "scorer", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
